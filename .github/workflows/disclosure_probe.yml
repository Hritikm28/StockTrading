name: Disclosure Feed Probe

# One-off: inspect what NSE's disclosure RSS items link to. Prints to the
# job log; commits nothing.
on:
  push:
    paths:
      - 'cloud_disclosure_probe.py'
      - '.github/workflows/disclosure_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python cloud_disclosure_probe.py

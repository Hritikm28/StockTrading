name: Rehearse the market dashboard (temporary)
# Dry run on real data: nothing is committed or emailed; caches are only read.
on:
  push:
    branches: [claude/gifted-mendel-59vd8y]
    paths: [.github/workflows/probe_data.yml]
jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache/restore@v4
        with:
          path: data/stocks
          key: none
          restore-keys: stockdata-v3-
      - uses: actions/cache/restore@v4
        with:
          path: data/alpha_cache
          key: none
          restore-keys: alphacache-v1-
      - uses: actions/cache/restore@v4
        with:
          path: data/insider_cache
          key: none
          restore-keys: insider-
      - run: pip install -q -r requirements_engine.txt matplotlib
      - name: Collect (first-run backfill, timed)
        run: time python market_data.py
      - name: Second collect (should fetch nothing)
        run: time python market_data.py
      - name: Stores
        run: |
          python - <<'PY'
          import pandas as pd, market_data as md
          for f in (md.INDEX_FILE, md.OI_FILE, md.DERIV_FILE, md.GLOBAL_FILE):
              d = pd.read_parquet(f); print(f.name, d.shape)
              print(d.tail(3).to_string())
          fl = md.load_filings(); print('filings', fl.shape, fl['kind'].value_counts().to_dict())
          print(fl.tail(5).to_string())
          PY
      - name: Dashboard
        run: |
          python market_dashboard.py
          python - <<'PY'
          import json
          d = json.load(open('paper_trading/results/dashboard.json'))
          print('bytes', len(json.dumps(d)))
          print('JSON_START' + json.dumps(d, separators=(',', ':')) + 'JSON_END')
          PY
      - name: Weekly email
        run: |
          python weekly_portfolio_report.py
          ls -la weekly_chart.png market_dashboard.png
          python -c "import re; t=re.sub(r'<[^>]+>',' ',open('weekly_email_body.html').read()); t=' '.join(t.split()); i=t.find('Signal report card'); print(t[i:i+6000])"
      - name: Daily email line
        run: |
          python - <<'PY'
          import json, re, dashboard_email as de
          d = json.load(open('paper_trading/results/dashboard.json'))
          print(re.sub(r'<[^>]+>', '', de.lights_summary(d)))
          PY

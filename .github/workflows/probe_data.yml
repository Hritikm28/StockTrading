name: Dry run official NSE prices (temporary)
on:
  push:
    branches: [claude/gifted-mendel-59vd8y]
    paths: [.github/workflows/probe_data.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pandas pyarrow numpy requests
      - name: Restore the live price files (read only)
        uses: actions/cache/restore@v4
        with:
          path: data/stocks
          key: stockdata-v3-probe-never-saved
          restore-keys: |
            stockdata-v3-
      - name: Dry run on a copy
        run: |
          rm -rf /tmp/stocks && cp -r data/stocks /tmp/stocks
          python -u - <<'PY'
          import time
          import pandas as pd
          import official_prices as op
          from market_calendar import latest_session
          d = '/tmp/stocks'
          frames = op.load_frames(d)
          print('stock files', len(frames), '| latest session', latest_session())
          watch = ['HFCL', 'STLTECH', 'CONCORDBIO', 'RELIANCE', 'CUPID']
          before = {s: frames[s]['Close'].iloc[-8:].round(2).to_dict() for s in watch if s in frames}
          jumps = sum(int(((df['Close'] / df['Close'].shift(1)).iloc[-401:].pipe(lambda r: (r < op.JUMP_LOW) | (r > op.JUMP_HIGH))).sum()) for df in frames.values())
          print('big one-day moves in the last 400 sessions before:', jumps)
          t = time.time()
          ev = op.update(latest_session(), d)
          print(f'took {time.time() - t:.0f}s; events {len(ev)}')
          after = op.load_frames(d)
          for s in before:
              print('==', s)
              print('   before', {str(k.date()): v for k, v in before[s].items()})
              print('   after ', {str(k.date()): round(v, 2) for k, v in after[s]['Close'].iloc[-8:].items()})
          jumps = sum(int(((df['Close'] / df['Close'].shift(1)).iloc[-401:].pipe(lambda r: (r < op.JUMP_LOW) | (r > op.JUMP_HIGH))).sum()) for df in after.values())
          print('big one-day moves in the last 400 sessions after:', jumps)
          import json, pathlib
          st = json.loads(pathlib.Path(d, op.STATE_FILE).read_text())
          print('state done', st['done'], '| checked', len(st['checked']))
          # how many bars differ from the stored ones, and by how much
          diffs = []
          for s, df in after.items():
              old = frames[s]['Close']
              common = df.index.intersection(old.index)
              x = (df.loc[common, 'Close'] / old.loc[common] - 1).abs()
              x = x[x > 0.001]
              if len(x):
                  diffs.append((s, len(x), round(float(x.max()) * 100, 2), str(x.idxmax().date())))
          print('files with changed bars', len(diffs))
          for row in sorted(diffs, key=lambda r: -r[2])[:25]:
              print('  ', row)
          PY

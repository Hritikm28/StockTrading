name: Probe data sources (temporary)
on:
  push:
    branches: [claude/gifted-mendel-59vd8y]
    paths: [.github/workflows/probe_data.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pandas pyarrow yfinance requests lxml
      - name: Index names in NSE's daily index file
        run: |
          python - <<'PY'
          import io, requests, pandas as pd
          h = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36', 'Referer': 'https://www.nseindia.com/'}
          for d in ['06112026', '04112026', '04012016', '01062020']:
              r = requests.get(f'https://nsearchives.nseindia.com/content/indices/ind_close_all_{d}.csv', headers=h, timeout=30)
              print('==', d, r.status_code, len(r.content))
              if r.status_code == 200:
                  df = pd.read_csv(io.StringIO(r.text)); print(list(df.columns))
                  names = df[df.columns[0]].astype(str)
                  print([n for n in names if 'omentum' in n or n.strip().lower() in ('nifty 50', 'india vix', 'nifty 500')])
          PY
      - name: Historical bhav formats
        run: |
          python - <<'PY'
          import io, time, zipfile, requests, pandas as pd
          h = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36', 'Referer': 'https://www.nseindia.com/'}
          def get(url):
              t = time.time(); r = requests.get(url, headers=h, timeout=30)
              return r, time.time() - t
          def show(label, url):
              r, dt = get(url)
              print('==', label, r.status_code, len(r.content), f'{dt:.2f}s', url)
              if r.status_code != 200: return
              try:
                  if url.endswith('.zip'):
                      z = zipfile.ZipFile(io.BytesIO(r.content)); df = pd.read_csv(z.open(z.namelist()[0]))
                  else:
                      df = pd.read_csv(io.StringIO(r.text))
                  df.columns = [c.strip() for c in df.columns]
                  print(list(df.columns)); print(len(df))
                  sc = next((c for c in df.columns if c.upper() in ('SERIES', 'SCTYSRS')), None)
                  if sc: print(df[sc].astype(str).str.strip().value_counts().head(8).to_dict())
              except Exception as e:
                  print('parse error', e)
          show('old 2016', 'https://archives.nseindia.com/content/historical/EQUITIES/2016/JAN/cm04JAN2016bhav.csv.zip')
          show('old 2016 nsearchives', 'https://nsearchives.nseindia.com/content/historical/EQUITIES/2016/JAN/cm04JAN2016bhav.csv.zip')
          show('full 2016', 'https://archives.nseindia.com/products/content/sec_bhavdata_full_04012016.csv')
          show('full 2020', 'https://archives.nseindia.com/products/content/sec_bhavdata_full_01062020.csv')
          show('old 2024-07-05', 'https://nsearchives.nseindia.com/content/historical/EQUITIES/2024/JUL/cm05JUL2024bhav.csv.zip')
          show('udiff 2024-07-08', 'https://nsearchives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_20240708_F_0000.csv.zip')
          show('udiff 2026-11-06', 'https://nsearchives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_20261106_F_0000.csv.zip')
          show('full 2026-11-06', 'https://nsearchives.nseindia.com/products/content/sec_bhavdata_full_06112026.csv')
          PY
      - name: Results dates for our worst stocks
        run: |
          python - <<'PY'
          import yfinance as yf
          for s in ['TDPOWERSYS.NS', 'CHENNPETRO.NS', 'APARINDS.NS', 'WELCORP.NS', 'AZAD.NS', 'RELIANCE.NS']:
              try:
                  e = yf.Ticker(s).get_earnings_dates(limit=60)
                  if e is None or e.empty: print(s, 'none'); continue
                  idx = e.index.tz_localize(None) if e.index.tz is not None else e.index
                  print(s, 'n', len(e), 'from', idx.min().date(), 'to', idx.max().date(),
                        'recent', [d.date().isoformat() for d in sorted(idx)[-4:]])
              except Exception as ex:
                  print(s, 'error', ex)
          PY

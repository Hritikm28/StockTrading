name: Probe NSE MCP servers (temporary)
on:
  push:
    branches: [claude/gifted-mendel-59vd8y]
    paths: [.github/workflows/probe_data.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests
      - name: Holdings closes and a year of splits/bonuses
        run: |
          python - <<'PY'
          import csv, io, json, time, requests
          URL = 'https://mcp.nseindia.in/bhavcopy/cm/mcp'
          H = {'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream',
               'User-Agent': 'StockTrading-research-probe/1.0'}
          def parse(r):
              if 'event-stream' in r.headers.get('content-type', ''):
                  for line in r.text.splitlines():
                      if line.startswith('data:'):
                          return json.loads(line[5:])
              return r.json()
          r = requests.post(URL, headers=H, timeout=60, json={'jsonrpc': '2.0', 'id': 1, 'method': 'initialize',
              'params': {'protocolVersion': '2025-06-18', 'capabilities': {}, 'clientInfo': {'name': 'probe', 'version': '1'}}})
          h = dict(H)
          if r.headers.get('mcp-session-id'):
              h['Mcp-Session-Id'] = r.headers['mcp-session-id']
          requests.post(URL, headers=h, timeout=30, json={'jsonrpc': '2.0', 'method': 'notifications/initialized'})
          def call(name, args):
              r = requests.post(URL, headers=h, timeout=90, json={'jsonrpc': '2.0', 'id': 3, 'method': 'tools/call',
                                                                   'params': {'name': name, 'arguments': args}})
              return json.loads(parse(r)['result']['content'][0]['text'])

          held = ['CUPID', 'WELCORP', 'TDPOWERSYS', 'ATHERENERG', 'APARINDS', 'SYRMA', 'LAURUSLABS', 'AZAD',
                  'POWERINDIA', 'MCX', 'CHENNPETRO', 'BHEL', 'SONACOMS', 'STLTECH', 'HFCL']
          print('== official closes, 2026-11-10 .. 2026-11-20')
          for s in held:
              try:
                  d = call('get_stock_history', {'symbol': s, 'months': 1, 'endDate': '2026-11-20'})
                  rows = [x for x in d['data'] if x['date'] >= '2026-11-10']
                  print('CLOSE', s, rows[-1]['series'] if rows else '?',
                        json.dumps({x['date'][5:]: x['close'] for x in rows}))
              except Exception as e:
                  print('CLOSE', s, 'ERR', e)

          print('== splits / bonuses in the NIFTY 500 over the last year')
          lst = requests.get('https://nsearchives.nseindia.com/content/indices/ind_nifty500list.csv',
                             headers={'User-Agent': 'Mozilla/5.0'}, timeout=30).text
          syms = [row['Symbol'] for row in csv.DictReader(io.StringIO(lst))]
          print('universe', len(syms))
          hits, fails = [], 0
          for s in syms:
              try:
                  d = call('get_corporate_actions', {'symbol': s, 'fromDate': '2025-11-21', 'toDate': '2026-11-20'})
                  for a in d.get('actions', []):
                      if a.get('actionType') in ('SPLIT', 'BONUS') or (a.get('adjustmentFactor') or 1) != 1:
                          hits.append((a['exDate'], s, a.get('actionType'), a.get('purpose'), a.get('adjustmentFactor')))
              except Exception as e:
                  fails += 1
              time.sleep(0.2)
          print('events', len(hits), 'stocks', len({x[1] for x in hits}), 'failed calls', fails)
          for x in sorted(hits):
              print('CA', *x)
          PY

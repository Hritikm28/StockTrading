name: Dry run the split fix (temporary)
on:
  push:
    branches: [claude/gifted-mendel-59vd8y]
    paths: [.github/workflows/probe_data.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pandas pyarrow numpy requests
      - uses: actions/cache/restore@v4
        with:
          path: data/stocks
          key: stockdata-v3-probe-never-saved
          restore-keys: |
            stockdata-v3-
      - run: |
          rm -rf /tmp/stocks && cp -r data/stocks /tmp/stocks
          python -u - <<'PY'
          import json, pandas as pd
          import official_prices as op
          from market_calendar import latest_session
          d = '/tmp/stocks'
          syms = ['APARINDS', 'AZAD', 'HFCL', 'FINCABLES', 'RRKABEL', 'TDPOWERSYS', 'TRENT', 'RELIANCE']
          def show(tag):
              f = op.load_frames(d)
              for s in syms:
                  print(tag, s, {str(k.date()): round(v, 2) for k, v in f[s].loc['2026-11-04':'2026-11-11', 'Close'].items()})
          show('before')
          print('latest session', latest_session())
          for i in (1, 2):
              print('== pass', i)
              ev = op.update(latest_session(), d)
          show('after ')
          evs = op.load_events(d)
          print('events kept', len(evs), evs[:3])
          print('state done tail', json.load(open(f'{d}/{op.STATE_FILE}'))['done'][-8:])
          PY

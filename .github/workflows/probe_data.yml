name: Probe data freshness (temporary)
on:
  push:
    branches: [claude/gifted-mendel-59vd8y]
    paths: [.github/workflows/probe_data.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore price data (read only, never saved)
        uses: actions/cache/restore@v4
        with:
          path: data/stocks
          key: probe-none
          restore-keys: |
            stockdata-v3-
      - run: pip install -q pandas pyarrow yfinance requests
      - name: Before
        run: |
          python - <<'PY'
          import pandas as pd, pathlib
          for s in ['NIFTY50','INDIAVIX','STLTECH','HFCL','CHENNPETRO','TDPOWERSYS','MCX']:
              f = pathlib.Path(f'data/stocks/{s}.parquet')
              if not f.exists(): print(s, 'NO FILE'); continue
              df = pd.read_parquet(f); print('==', s, len(df)); print(df.tail(3)[['Open','Close','Volume']])
          PY
      - name: Raw bhav rows for 2026-11-05
        run: |
          python - <<'PY'
          import io, requests, pandas as pd
          h = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
               'Referer': 'https://www.nseindia.com/'}
          r = requests.get('https://archives.nseindia.com/products/content/sec_bhavdata_full_05112026.csv', headers=h, timeout=30)
          print('status', r.status_code, len(r.content))
          df = pd.read_csv(io.StringIO(r.text)); df.columns = [c.strip() for c in df.columns]
          for c in df.columns:
              if df[c].dtype == object: df[c] = df[c].str.strip()
          print(df[df['SYMBOL'].isin(['STLTECH','HFCL','CHENNPETRO','TDPOWERSYS'])].to_string())
          PY
      - name: Yahoo directly
        run: |
          python - <<'PY'
          import yfinance as yf
          for s in ['STLTECH.NS','HFCL.NS','^NSEI','^INDIAVIX','CHENNPETRO.NS']:
              d = yf.download(s, period='7d', progress=False, auto_adjust=False)
              print('==', s); print(d.tail(4))
          PY
      - name: New updater on the restored copy
        run: python quick_update_data.py
      - name: After
        run: |
          python - <<'PY'
          import pandas as pd, pathlib
          for s in ['NIFTY50','INDIAVIX','STLTECH','HFCL','CHENNPETRO']:
              f = pathlib.Path(f'data/stocks/{s}.parquet')
              if not f.exists(): print(s, 'NO FILE'); continue
              df = pd.read_parquet(f); print('==', s, len(df)); print(df.tail(3)[['Open','Close','Volume']])
          PY
